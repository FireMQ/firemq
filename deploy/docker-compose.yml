# docker compose -f deploy/docker-compose.yml up
services:
  firemq:
    image: ghcr.io/firemq/firemq:latest
    ports:
      - "5672:5672"    # AMQP 0-9-1
      - "5673:5673"    # FireMQ protocol
      - "15672:15672"  # management UI, API, metrics, WebSocket
    volumes:
      - firemq-data:/data
    environment:
      FIREMQ_DEFAULT_USER: guest
      FIREMQ_DEFAULT_PASS: guest
volumes:
  firemq-data:
