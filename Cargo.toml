[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/FireMQ/firemq"
homepage = "https://github.com/FireMQ/firemq"
authors = ["The FireMQ Authors"]

[workspace.dependencies]
firemq-amqp-codec = { path = "crates/firemq-amqp-codec", version = "0.1.0" }
firemq-proto = { path = "crates/firemq-proto", version = "0.1.0" }
firemq-core = { path = "crates/firemq-core", version = "0.1.0" }
firemq-store = { path = "crates/firemq-store", version = "0.1.0" }
firemq-amqp = { path = "crates/firemq-amqp", version = "0.1.0" }
firemq-server = { path = "crates/firemq-server", version = "0.1.0" }
firemq-client = { path = "crates/firemq-client", version = "0.1.0" }

arc-swap = "1.7"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
crc32c = "0.6"
futures = "0.3"
parking_lot = "0.12"
proptest = "1"
rand = "0.9"
regex = "1"
rmp-serde = "1"
rmpv = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = "0.27"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
debug = true
