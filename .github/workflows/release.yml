name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, for example v0.1.0
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, arch: arm64 }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p firemq --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name=firemq-${{ matrix.target }}
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/firemq LICENSE README.md "$name"/
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          if [ -n "${{ matrix.arch }}" ]; then
            mkdir -p dist/${{ matrix.arch }}
            cp target/${{ matrix.target }}/release/firemq dist/${{ matrix.arch }}/firemq
          fi
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "firemq-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/firemq.exe, LICENSE, README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            firemq-*.tar.gz
            firemq-*.zip
            firemq-*.sha256
      - if: matrix.arch
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.arch }}
          path: dist

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh assets/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "FireMQ $TAG" --generate-notes --verify-tag
          fi

  docker:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-*
          merge-multiple: true
          path: dist
      - run: chmod +x dist/*/firemq && mkdir -p dist/data
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        run: |
          version="${TAG#v}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file deploy/Dockerfile.release \
            --tag "ghcr.io/firemq/firemq:${version}" \
            --tag "ghcr.io/firemq/firemq:latest" \
            --push .
