name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  conformance:
    name: SDK conformance (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p firemq-conformance --locked
      - run: ./target/debug/firemq-conformance run --driver "./target/debug/firemq-conformance driver"

  broker:
    name: Build broker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p firemq --locked
      - uses: actions/upload-artifact@v4
        with:
          name: firemq-debug
          path: target/debug/firemq
          retention-days: 3

  musl:
    name: Build static Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The same build as the release workflow, so a broken release build shows up here.
      - run: cargo build --release --locked -p firemq --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - run: ./target/x86_64-unknown-linux-musl/release/firemq --version

  compat:
    name: RabbitMQ client (${{ matrix.client }})
    needs: broker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [pika, amqplib, amqp091-go, java, dotnet, amqp091-go-upstream, rabbitmqadmin]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: firemq-debug
      - name: Start FireMQ
        run: |
          chmod +x firemq
          ./firemq --ephemeral > firemq.log 2>&1 &
          for i in $(seq 1 50); do nc -z 127.0.0.1 15672 && break; sleep 0.1; done
      - if: matrix.client == 'pika'
        uses: astral-sh/setup-uv@v6
      - if: matrix.client == 'pika'
        run: uv run --with pika --with pytest pytest compat/python -v
      - if: matrix.client == 'amqplib'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.client == 'amqplib'
        working-directory: compat/node
        run: npm install --no-audit --no-fund && npm test
      - if: startsWith(matrix.client, 'amqp091-go')
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: compat/go/go.sum
      - if: matrix.client == 'amqp091-go'
        working-directory: compat/go
        run: go test -count=1 -v ./...
      - if: matrix.client == 'amqp091-go-upstream'
        name: amqp091-go's own integration tests
        run: |
          git clone --depth 1 --branch v1.10.0 https://github.com/rabbitmq/amqp091-go.git /tmp/amqp091-go
          cd /tmp/amqp091-go
          # The suite's integrationRabbitMQ helper and TestIntegrationRecoverNotImplemented
          # open a connection and only close it when the server's product is "RabbitMQ", so
          # against any other broker goleak reports those two connections' goroutines.
          python3 - <<'PY'
          import re
          p = "integration_test.go"
          s = open(p).read()
          s = s.replace(
              "goleak.VerifyTestMain(m)",
              'goleak.VerifyTestMain(m, goleak.IgnoreTopFunction("github.com/rabbitmq/amqp091-go.(*Connection).heartbeater"), goleak.IgnoreTopFunction("internal/poll.runtime_pollWait"))',
          )
          open(p, "w").write(s)
          PY
          status=0
          go test -tags integration -count=1 -timeout 300s -v ./... > /tmp/upstream.log 2>&1 || status=$?
          grep -E '^(--- |ok|FAIL|PASS)' /tmp/upstream.log || true
          if [ "$status" -ne 0 ]; then
            echo "::group::Last 120 lines of the test log"
            grep -vE '^=== (RUN|PAUSE|CONT)' /tmp/upstream.log | tail -n 120
            echo "::endgroup::"
          fi
          exit $status
      - if: matrix.client == 'rabbitmqadmin'
        name: RabbitMQ's rabbitmqadmin against the management API
        run: compat/rabbitmqadmin.sh
      - if: matrix.client == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.client == 'java'
        run: compat/java/run.sh
      - if: matrix.client == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - if: matrix.client == 'dotnet'
        working-directory: compat/dotnet
        run: dotnet run
      - name: Broker log
        if: always()
        run: tail -n 200 firemq.log
