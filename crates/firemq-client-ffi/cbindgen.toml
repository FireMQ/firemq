# Generates bindings/c/firemq.h: cbindgen --config cbindgen.toml --output ../../bindings/c/firemq.h
language = "C"
cpp_compat = true
include_guard = "FIREMQ_H"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
documentation_style = "c99"
autogen_warning = "/* Generated by cbindgen from crates/firemq-client-ffi/src/c.rs; run bindings/generate.sh. */"
header = """/*
 * FireMQ client: C API.
 *
 * Link against libfiremq_client_ffi (.so, .dylib, .dll or the static .a).
 *
 * Errors
 *   Fallible functions return FIREMQ_OK (0) or one of the FIREMQ_ERR_* statuses and write
 *   their results through out-pointers. After a failure, firemq_last_error() describes it and
 *   firemq_last_error_code() gives the AMQP reply code (403, 404, 406, 312...) on the calling
 *   thread, until the next FireMQ call that returns a status on that thread.
 *
 * Ownership
 *   - Handles are owned by the caller and released once with their free function:
 *       FiremqClient       -> firemq_free
 *       FiremqSubscription -> firemq_subscription_free
 *       FiremqMessage      -> firemq_message_free
 *     A message or subscription may outlive the client handle it came from; the connection
 *     closes when all of them are freed, or at once with firemq_close().
 *   - Non-const pointers returned through out-pointers or as results (char *, uint8_t *) are
 *     owned by the caller: release strings with firemq_string_free and buffers with
 *     firemq_buffer_free.
 *   - const pointers (const char *, const uint8_t *) are borrowed from the handle they came
 *     from and stay valid until that handle is freed. firemq_last_error() is valid until the
 *     next status-returning call on the same thread. firemq_version() is static.
 *   - The library copies every argument; the caller keeps ownership of what it passes.
 *
 * Arguments
 *   Strings are NUL-terminated UTF-8. Arguments documented as optional may be NULL. Queue and
 *   binding arguments, headers and properties are JSON objects.
 *
 * Threads
 *   Calls block until the broker answers. Every handle may be used from any thread; calls on
 *   one subscription are serialized.
 */"""

[export]
prefix = ""
item_types = ["functions", "constants", "structs", "opaque"]

[parse]
parse_deps = false
